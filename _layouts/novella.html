---
layout: default
---
<main class="page novella-page">
  <div class="container">
    <article class="novella">
      <header class="novella-header">
        <h1>{{ page.title }}</h1>
        {% if page.subtitle %}<p class="vision-subtitle">{{ page.subtitle }}</p>{% endif %}
        {% if page.date_label %}<p class="post-date">{{ page.date_label }}</p>{% endif %}
      </header>
      <div class="prose novella-content">
        {% if page.cover_image %}
        <img src="{{ page.cover_image }}" alt="{{ page.title }}" class="novella-cover">
        {% endif %}
        {{ content }}
      </div>
    </article>
  </div>
</main>
